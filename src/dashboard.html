<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>atlas serve</title>
<style>
/* Single-tone borderless dashboard: one gray ink on one paper tone. */
:root { color-scheme: light; }
* { box-sizing: border-box; border: 0; margin: 0; padding: 0; }
body { background: #f4f4f2; color: #2b2b2b; font: 14px/1.5 system-ui, sans-serif; }
main { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 20px; font-weight: 600; letter-spacing: .02em; }
p.sub { opacity: .65; margin: 2px 0 20px; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; opacity: .6; margin: 24px 0 8px; }
ul { list-style: none; }
li { background: #e9e9e6; padding: 8px 12px; margin: 0 0 6px; border-radius: 6px; }
li .state { opacity: .6; font-size: 12px; }
#atlas-status { font-size: 12px; opacity: .6; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>atlas serve</h1>
  <p class="sub">Local task dashboard. Live updates over websocket, no reload.</p>
  <h2>Tasks</h2>
  <ul id="atlas-tasks"><li>connecting…</li></ul>
  <h2>History</h2>
  <ul id="atlas-history"><li>connecting…</li></ul>
  <p id="atlas-status">ws: connecting…</p>
</main>
<script>
(function () {
  var tasksEl = document.getElementById("atlas-tasks");
  var histEl = document.getElementById("atlas-history");
  var statusEl = document.getElementById("atlas-status");
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function render(state) {
    var tasks = state.tasks || [];
    tasksEl.innerHTML = tasks.length
      ? tasks.map(function (t) {
          return '<li><span class="state">[' + esc(t.state) + ']</span> ' +
            esc(t.title) + ' <span class="state">' + esc(t.id) + '</span></li>';
        }).join("")
      : "<li>no tasks</li>";
    var events = state.events || [];
    histEl.innerHTML = events.length
      ? events.map(function (e) {
          return '<li><span class="state">#' + esc(e.id) + ' ' + esc(e.kind) + '</span> ' +
            esc(e.payload) + '</li>';
        }).join("")
      : "<li>no events</li>";
  }
  function connect() {
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    var ws = new WebSocket(proto + "//" + location.host + "/ws");
    ws.onopen = function () { statusEl.textContent = "ws: live"; };
    ws.onmessage = function (ev) {
      try { render(JSON.parse(ev.data)); }
      catch (e) { statusEl.textContent = "ws: bad frame"; }
    };
    ws.onclose = function () {
      statusEl.textContent = "ws: reconnecting…";
      setTimeout(connect, 1000);
    };
  }
  connect();
})();
</script>
</body>
</html>
