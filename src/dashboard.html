<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>atlas serve</title>
<style>
/* Clean minimal dashboard with project filter and DAG tree visualization */
:root { color-scheme: light; }
* { box-sizing: border-box; border: 0; margin: 0; padding: 0; }
body { background: #f4f4f2; color: #2b2b2b; font: 14px/1.5 system-ui, -apple-system, sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
header { margin-bottom: 24px; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
p.sub { opacity: .65; margin: 4px 0 16px; font-size: 13px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: #e8e8e4; padding: 10px 14px; border-radius: 8px; margin-bottom: 20px; }
.toolbar-group { display: flex; align-items: center; gap: 8px; }
label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; opacity: .7; }
select, button { background: #ffffff; color: #2b2b2b; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid #d4d4d0; outline: none; }
select:focus, button:focus { border-color: #6366f1; }
.btn-toggle { background: #ffffff; border: 1px solid #d4d4d0; }
.btn-toggle.active { background: #6366f1; color: #ffffff; border-color: #6366f1; }

.section-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 8px; }
h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; opacity: .6; }
.badge-count { font-size: 11px; background: #deded9; padding: 2px 8px; border-radius: 12px; font-weight: 600; }

ul { list-style: none; }
li { background: #e9e9e6; padding: 10px 14px; margin: 0 0 6px; border-radius: 6px; display: flex; align-items: center; gap: 8px; font-size: 13px; }
li.tree-node { display: block; padding: 8px 12px; margin-bottom: 4px; border-left: 3px solid #ccc; background: #eaeaea; }
li.tree-node.state-completed { border-left-color: #10b981; }
li.tree-node.state-ready { border-left-color: #6366f1; }
li.tree-node.state-inprogress { border-left-color: #f59e0b; }
li.tree-node.state-pending { border-left-color: #9ca3af; }

.state-badge { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
.state-completed .state-badge, .badge-completed { background: #d1fae5; color: #065f46; }
.state-ready .state-badge, .badge-ready { background: #e0e7ff; color: #3730a3; }
.state-inprogress .state-badge, .badge-inprogress { background: #fef3c7; color: #92400e; }
.state-pending .state-badge, .badge-pending { background: #f3f4f6; color: #4b5563; }

.tree-children { margin-left: 18px; margin-top: 6px; }
.task-id { font-family: monospace; font-size: 11px; opacity: .5; margin-left: auto; }
#atlas-status { font-size: 12px; opacity: .6; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>atlas serve</h1>
    <p class="sub">Local task dashboard. Live updates over websocket, no reload.</p>
  </header>

  <div class="toolbar">
    <div class="toolbar-group">
      <label for="project-select">Proyecto:</label>
      <select id="project-select">
        <option value="">TODOS LOS PROYECTOS</option>
      </select>
    </div>
    <div class="toolbar-group">
      <label>Vista:</label>
      <button id="btn-view-tree" class="btn-toggle active" type="button">Árbol DAG</button>
      <button id="btn-view-list" class="btn-toggle" type="button">Lista Plana</button>
    </div>
  </div>

  <div class="section-head">
    <h2>Tasks</h2>
    <span id="tasks-count" class="badge-count">0</span>
  </div>
  <ul id="atlas-tasks"><li>connecting…</li></ul>

  <div class="section-head">
    <h2>History</h2>
    <span id="events-count" class="badge-count">0</span>
  </div>
  <ul id="atlas-history"><li>connecting…</li></ul>

  <p id="atlas-status">ws: connecting…</p>
</main>
<script>
(function () {
  var tasksEl = document.getElementById("atlas-tasks");
  var histEl = document.getElementById("atlas-history");
  var statusEl = document.getElementById("atlas-status");
  var projectSelect = document.getElementById("project-select");
  var tasksCountEl = document.getElementById("tasks-count");
  var eventsCountEl = document.getElementById("events-count");
  var btnViewTree = document.getElementById("btn-view-tree");
  var btnViewList = document.getElementById("btn-view-list");

  var currentMode = "tree"; // "tree" | "list"
  var currentProject = "";
  var latestState = { tasks: [], events: [] };
  var projectListPopulated = false;

  btnViewTree.onclick = function() {
    currentMode = "tree";
    btnViewTree.classList.add("active");
    btnViewList.classList.remove("active");
    render(latestState);
  };

  btnViewList.onclick = function() {
    currentMode = "list";
    btnViewList.classList.add("active");
    btnViewTree.classList.remove("active");
    render(latestState);
  };

  projectSelect.onchange = function() {
    currentProject = projectSelect.value;
    render(latestState);
  };

  function esc(s) {
    return String(s || "").replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function getProjectName(t) {
    var title = t.title || "";
    var m = title.match(/\[([a-zA-Z0-9_-]+)\]/);
    if (m) return m[1].toUpperCase();
    var dash = (t.id || "").indexOf("-");
    if (dash > 0) return t.id.substring(0, dash).toUpperCase();
    return "GENERAL";
  }

  function populateProjects(tasks) {
    if (projectListPopulated && tasks.length === 0) return;
    var counts = {};
    for (var i = 0; i < tasks.length; i++) {
      var p = getProjectName(tasks[i]);
      counts[p] = (counts[p] || 0) + 1;
    }
    var keys = Object.keys(counts).sort();
    var curVal = projectSelect.value;
    var html = '<option value="">TODOS LOS PROYECTOS (' + tasks.length + ')</option>';
    for (var j = 0; j < keys.length; j++) {
      var k = keys[j];
      html += '<option value="' + esc(k) + '">' + esc(k) + ' (' + counts[k] + ')</option>';
    }
    projectSelect.innerHTML = html;
    projectSelect.value = curVal;
    projectListPopulated = true;
  }

  function buildTreeFromTasks(tasks) {
    var taskMap = {};
    for (var i = 0; i < tasks.length; i++) {
      var t = tasks[i];
      taskMap[t.id] = { task: t, children: [] };
    }
    var roots = [];
    for (var j = 0; j < tasks.length; j++) {
      var item = tasks[j];
      // If title or id indicates root-epic or no parents
      if (item.id.indexOf("-root-epic") > 0 || !item.parents || item.parents.length === 0) {
        roots.push(taskMap[item.id]);
      }
    }
    if (roots.length === 0) {
      for (var k in taskMap) roots.push(taskMap[k]);
    }
    return roots;
  }

  function renderTreeNode(node, depth) {
    var t = node.task || node;
    var st = (t.state || "pending").toLowerCase().replace("_", "");
    var badgeClass = "badge-" + st;
    var html = '<li class="tree-node state-' + st + '" style="margin-left:' + (depth * 16) + 'px;">';
    html += '<span class="state-badge ' + badgeClass + '">' + esc(t.state) + '</span> ';
    html += '<strong>' + esc(t.title) + '</strong>';
    html += '<span class="task-id">' + esc(t.id) + '</span>';
    html += '</li>';

    if (node.children && node.children.length > 0) {
      for (var i = 0; i < node.children.length; i++) {
        html += renderTreeNode(node.children[i], depth + 1);
      }
    }
    return html;
  }

  function render(state) {
    latestState = state || { tasks: [], events: [] };
    var allTasks = latestState.tasks || [];
    populateProjects(allTasks);

    var filteredTasks = allTasks;
    if (currentProject) {
      filteredTasks = allTasks.filter(function(t) {
        return getProjectName(t) === currentProject.toUpperCase();
      });
    }

    tasksCountEl.textContent = filteredTasks.length;

    if (filteredTasks.length === 0) {
      tasksEl.innerHTML = "<li>no tasks</li>";
    } else if (currentMode === "list") {
      tasksEl.innerHTML = filteredTasks.map(function (t) {
        var st = (t.state || "pending").toLowerCase().replace("_", "");
        var dodInfo = "";
        if (t.dod_total > 0) {
          dodInfo = ' <span class="badge-count" style="background:#e0e7ff; color:#3730a3;">DoD: ' + t.dod_checked + '/' + t.dod_total + '</span>';
        }
        return '<li><span class="state-badge badge-' + st + '">[' + esc(t.state) + ']</span> ' +
          esc(t.title) + dodInfo + ' <span class="task-id">' + esc(t.id) + '</span></li>';
      }).join("");
    } else {
      // Tree mode: fetch or build tree
      var roots = buildTreeFromTasks(filteredTasks);
      tasksEl.innerHTML = roots.map(function(r) { return renderTreeNode(r, 0); }).join("");
    }

    var gestaltEvents = latestState.gestalt_events || [];
    var events = latestState.events || [];
    var combinedEvents = [];
    
    // Prioritize Gestalt live telemetry
    for (var g = 0; g < gestaltEvents.length; g++) {
      var gev = gestaltEvents[g];
      combinedEvents.push({
        isGestalt: true,
        badge: (gev.agent_id || "agent").toUpperCase(),
        type: gev.event_type || "TELEMETRY",
        project: gev.project || "",
        summary: gev.summary || gev.payload || "",
        time: gev.created_at || ""
      });
    }
    for (var e = 0; e < events.length; e++) {
      var ev = events[e];
      combinedEvents.push({
        isGestalt: false,
        badge: "ATLAS #" + ev.id,
        type: ev.kind || "",
        project: "",
        summary: ev.payload || "",
        time: ""
      });
    }

    eventsCountEl.textContent = combinedEvents.length;
    histEl.innerHTML = combinedEvents.length
      ? combinedEvents.map(function (item) {
          var badgeClass = item.isGestalt ? "badge-inprogress" : "badge-ready";
          var projLabel = item.project ? '<strong>[' + esc(item.project.toUpperCase()) + ']</strong> ' : '';
          return '<li><span class="state-badge ' + badgeClass + '">' + esc(item.badge) + ' ' + esc(item.type) + '</span> ' +
            projLabel + esc(item.summary) + '</li>';
        }).join("")
      : "<li>no events</li>";
  }

  function connect() {
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    var ws = new WebSocket(proto + "//" + location.host + "/ws");
    ws.onopen = function () { statusEl.textContent = "ws: live"; };
    ws.onmessage = function (ev) {
      try { render(JSON.parse(ev.data)); }
      catch (e) { statusEl.textContent = "ws: bad frame"; }
    };
    ws.onclose = function () {
      statusEl.textContent = "ws: reconnecting…";
      setTimeout(connect, 1000);
    };
  }
  connect();
})();
</script>
</body>
</html>
